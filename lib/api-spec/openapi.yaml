            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceSelector" }
  /workspaces/select:
    post:
      operationId: selectWorkspace
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceSelectionInput" }
      responses:
        "200":
          description: Workspace selected for subsequent tenant-scoped requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSelector" }
  /permission-groups/{groupId}:
    patch:
      operationId: updatePermissionGroup
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGroupInput"
      responses:
        "200":
          description: Permission group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroup"
    delete:
      operationId: deletePermissionGroup
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Permission group deleted
  /permissions:
    get:
      operationId: listPermissions
      tags: [members]
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      responses:
        "200":
          description: Current workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /members/{membershipId}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /invitations:
    post:
      operationId: createInvitation
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptanceInput" }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationAcceptance" }
  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [members]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "204": { description: Invitation revoked }
  /invitations/{invitationId}/reissue:
    post:
      operationId: reissueInvitation
      tags: [members]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "201":
          description: Invitation reissued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
  /public/videos/{videoId}:
    get:
      operationId: getPublicVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Provider-neutral public playback metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVideo"
  /public/videos/{videoId}/source:
    get:
      operationId: getPublicVideoSource
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "307":
          description: Redirect to a short-lived signed playback manifest
          headers:
            Location:
              schema: { type: string }
  /public/videos/{videoId}/thumbnail:
    get:
      operationId: getPublicVideoThumbnail
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      description: Requires the opaque current `v` query value returned in thumbnailUrl.
      responses:
        "200":
          description: Public or unlisted thumbnail bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
  /public/videos/{videoId}/analytics-grant:
    post:
      operationId: createPlaybackAnalyticsGrant
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackAnalyticsGrantInput"
      responses:
        "201":
          description: Short-lived analytics grant bound to one playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackAnalyticsGrant"
        "400": { description: Invalid playback session }
        "404": { description: Public video is unavailable }
        "429":
          description: Analytics grant rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }
  /public/playback-events:
    post:
      operationId: createPlaybackEvents
      tags: [videos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackEventBatch"
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, duplicates]
                properties:
                  accepted: { type: number }
                  duplicates: { type: number }
        "400": { description: Invalid event batch }
        "401": { description: "Missing, malformed, tampered, or expired analytics grant" }
        "403": { description: Grant is not valid for the active public embed }
        "409": { description: Event identifier collision }
        "429":
          description: Analytics ingestion rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }
components:
  responses:
    AuthenticationRequired:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PermissionRequired:
      description: Workspace permission required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BillingConflict:
      description: Billing state conflicts with the requested mutation
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    InvalidBillingRequest:
      description: Billing request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BillingProviderUnavailable:
      description: Billing provider operation is temporarily unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  parameters:
    VideoId:
      in: path
      name: videoId
      required: true
      schema:
        type: string
        format: uuid
    FolderId:
      in: path
      name: folderId
      required: true
      schema:
        type: string
    GroupId:
      in: path
      name: groupId
      required: true
      schema:
        type: string
    MembershipId:
      in: path
      name: membershipId
      required: true
      schema:
        type: string
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    WebhookReceived:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received: { type: boolean, const: true }
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    MasterStorageOperation:
      type: object
      additionalProperties: false
      required: [operation, state, diagnosticCode, retryable, createdAt, updatedAt, completedAt]
      properties:
        operation: { type: string, enum: [archive, restore] }
        state: { type: string, enum: [pending, dispatching, queued, processing, completed, failed, reconciliation_required, cancelled] }
        diagnosticCode: { type: string, nullable: true }
        retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    MasterStorageStatus:
      type: object
      additionalProperties: false
      required: [storageConfigured, sourceTransferConfigured, hasArchivedMaster, archivedAt, latestArchiveOperation, latestRestoreOperation]
      properties:
        storageConfigured: { type: boolean }
        sourceTransferConfigured: { type: boolean }
        hasArchivedMaster: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        latestArchiveOperation: { allOf: [ { $ref: "#/components/schemas/MasterStorageOperation" } ], nullable: true }
        latestRestoreOperation: { allOf: [ { $ref: "#/components/schemas/MasterStorageOperation" } ], nullable: true }
    WorkspaceOnboardingInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        slug:
          type: string
          minLength: 2
          maxLength: 63
          description: Human-entered slug normalized by the server to lower kebab case.
    WorkspaceOnboardingRef:
      type: object
      additionalProperties: false
      properties:
        workspaceId: { type: string }
    WorkspaceOnboardingWorkspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [provisioning, active, failed, suspended] }
    WorkspaceProvisioningSummary:
      type: object
      additionalProperties: false
      required: [state, retryable, message]
      properties:
        state: { type: string, enum: [pending, creating, ready, reconciliation_required, unavailable, failed] }
        retryable: { type: boolean }
        message: { type: string }
    WorkspaceOnboarding:
      type: object
      additionalProperties: false
      required: [state, provisioning]
      properties:
        state: { type: string, enum: [needs_workspace, provisioning, active, failed, suspended] }
        workspace: { $ref: "#/components/schemas/WorkspaceOnboardingWorkspace" }
        provisioning: { $ref: "#/components/schemas/WorkspaceProvisioningSummary" }
    BillingPrice:
      type: object
      additionalProperties: false
      required: [interval, amount, currency]
      properties:
        interval: { type: string, enum: [month, year] }
        amount: { type: number }
        currency: { type: string, enum: [usd] }
    BillingCatalogPlan:
      type: object
      additionalProperties: false
      required: [code, name, description, entitlements, prices]
      properties:
        code: { type: string, enum: [starter, growth, scale] }
        name: { type: string }
        description: { type: string }
        entitlements: { type: object, additionalProperties: true }
        prices: { type: array, minItems: 2, maxItems: 2, items: { $ref: "#/components/schemas/BillingPrice" } }
    BillingCatalog:
      type: object
      additionalProperties: false
      required: [plans]
      properties:
        plans: { type: array, items: { $ref: "#/components/schemas/BillingCatalogPlan" } }
    BillingPlanInput:
      type: object
      additionalProperties: false
      required: [plan, interval, idempotencyKey]
      properties:
        plan: { type: string, enum: [starter, growth, scale] }
        interval: { type: string, enum: [month, year] }
        idempotencyKey:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    BillingActionInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
    BillingUrl:
      type: object
      additionalProperties: false
      required: [url]
      properties: { url: { type: string, format: uri } }
    BillingSubscription:
      type: object
      additionalProperties: false
      required: [status, cancelAtPeriodEnd, capabilities]
      properties:
        status: { type: string, enum: [unmanaged, incomplete, active, trialing, past_due, unpaid, canceled, restricted, quarantined] }
        plan: { type: ["string", "null"], enum: [starter, growth, scale, null] }
        pendingPlan: { type: ["string", "null"], enum: [starter, growth, scale, null] }
        pendingEffectiveAt: { type: ["string", "null"], format: date-time }
        interval: { type: ["string", "null"], enum: [month, year, null] }
        periodStart: { type: ["string", "null"], format: date-time }
        periodEnd: { type: ["string", "null"], format: date-time }
        graceEndsAt: { type: ["string", "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        capabilities:
          type: object
          additionalProperties: false
          required: [canManage, canSubscribe]
          properties:
            canManage: { type: boolean }
            canSubscribe: { type: boolean }
    BillingChangeResult:
      type: object
      additionalProperties: false
      required: [scheduled, effectiveAt]
      properties:
        scheduled: { type: boolean }
        effectiveAt: { type: ["string", "null"], format: date-time }
    BillingCancellation:
      type: object
      additionalProperties: false
      required: [cancelAtPeriodEnd]
      properties: { cancelAtPeriodEnd: { type: boolean } }
    BillingInvoice:
      type: object
      additionalProperties: false
      required: [id, createdAt, amountDue, amountPaid, currency]
      properties:
        id:
          type: string
          description: Opaque invoice reference intentionally exposed for stable client rendering; it is not an authorization credential.
        status: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        amountDue: { type: number }
        amountPaid: { type: number }
        currency: { type: string }
        hostedInvoiceUrl:
          type: ["string", "null"]
          format: uri
          description: Validated HTTPS URL on a Stripe-owned host.
        invoicePdf:
          type: ["string", "null"]
          format: uri
          description: Validated HTTPS URL on a Stripe-owned host.
    BillingInvoiceList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BillingInvoice" } }
        nextCursor:
          type: ["string", "null"]
          pattern: "^in_[A-Za-z0-9]+$"
          description: Opaque provider pagination reference; it is not an authorization credential.
    BillingReconcileResult:
      type: object
      additionalProperties: false
      required: [status, reconciledAt]
      properties:
        status: { type: string }
        reconciledAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    RuntimeConfig:
      type: object
      required: [productName, appDomain]
      properties:
        productName: { type: string }
        appDomain: { type: string }
    Workspace:
      type: object
      required: [id, name, slug, plan, memberCount, storageUsedGb, storageLimitGb, entitlements, billingAccess, permissions, playerAccent, playerControlForeground, playerControlBackground, logoInitials, hasLogoAsset, hasWatermarkAsset, posterTreatment, customDomain, customDomainVerified]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan: { type: string }
        memberCount: { type: number }
        storageUsedGb: { type: number }
        storageLimitGb: { type: number }
        entitlements:
          type: object
          additionalProperties:
            oneOf:
              - { type: boolean }
              - { type: number }
              - { type: string }
        billingAccess:
          type: object
          required: [status, canCreate, graceEndsAt]
          properties:
            status: { type: string }
            canCreate: { type: boolean }
            graceEndsAt: { type: ["string", "null"], format: date-time }
        permissions:
          type: array
          items: { type: string }
        playerAccent: { type: string }
        playerControlForeground: { type: string }
        playerControlBackground: { type: string }
        logoInitials: { type: string }
        hasLogoAsset: { type: boolean }
        hasWatermarkAsset: { type: boolean }
        posterTreatment:
          type: string
          enum: [default, darken, gradient]
        customDomain: { type: ["string", "null"] }
        customDomainVerified: { type: boolean }
    WorkspaceSelector:
      type: object
      additionalProperties: false
      required: [id, name, slug, current]
      properties:
        id: { type: string, format: uuid }
