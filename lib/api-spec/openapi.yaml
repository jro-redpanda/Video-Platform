openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Multi-tenant video platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: onboarding
  - name: dashboard
  - name: videos
  - name: folders
  - name: workspace
  - name: custom-domain
  - name: members
  - name: billing
  - name: audit
  - name: webhooks
paths:
  /auth/{splat}:
    summary: Provider-owned authentication boundary
    description: Better Auth owns the methods, subpaths, request bodies, and responses below this path. It is intentionally excluded from generated product clients.
    x-provider-owned: better-auth
    parameters:
      - in: path
        name: splat
        required: true
        schema: { type: string }
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [webhooks]
      x-internal: true
      description: Provider-signed ingress. The raw request bytes are verified before JSON parsing and this operation is intentionally excluded from generated product clients.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Verified event accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/WebhookReceived" } } }
        "400":
          description: Missing or invalid signature, malformed body, or rejected event
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /webhooks/bunny/encode:
    post:
      operationId: receiveBunnyEncodeWebhook
      tags: [webhooks]
      x-internal: true
      description: Provider-signed ingress. The raw request bytes and provider-specific headers are verified before processing; this operation is intentionally excluded from generated product clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Verified encode event accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/WebhookAccepted" } } }
        "400":
          description: Malformed webhook body
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Webhook verification failed
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Webhook matched more than one provider tenant
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Webhook verification is temporarily unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /provider-tests/bunny/{token}:
    post:
      operationId: receiveBunnyProviderTestCallback
      tags: [webhooks]
      x-internal: true
      description: Token-authenticated provider round-trip callback used by provider conformance tests. It is intentionally excluded from generated product clients.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, writeOnly: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Callback accepted }
        "400": { description: Malformed callback body }
        "401": { description: Callback token or provider signature rejected }
  /onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      responses:
        "200":
          description: Authenticated user's provider-neutral workspace onboarding state
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceOnboarding" } } }
        "401": { description: Authentication required }
  /onboarding/workspaces:
    post:
      operationId: createOnboardingWorkspace
      tags: [onboarding]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceOnboardingInput" } } }
      responses:
        "202":
          description: Workspace creation and background provisioning accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceOnboarding" } } }
        "400": { description: Invalid workspace name or slug }
        "401": { description: Authentication required }
        "409": { description: User already belongs to a workspace or slug is unavailable }
  /onboarding/retry:
    post:
      operationId: retryOnboarding
      tags: [onboarding]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceOnboardingRef" } } }
      responses:
        "202":
          description: Safe provisioning retry accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceOnboarding" } } }
        "401": { description: Authentication required }
        "403": { description: Only the workspace owner may retry }
        "409": { description: Workspace state is not safely retryable }
  /billing/catalog:
    get:
      operationId: getBillingCatalog
      tags: [billing]
      responses:
        "200":
          description: Authoritative active billing catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingCatalog" } } }
        "503":
          description: Billing catalog is unavailable or does not match the configured provider catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      responses:
        "200":
          description: Current tenant billing projection
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscription" } } }
        "401":
          description: Authentication required
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlanInput" } } }
      responses:
        "201":
          description: Hosted Stripe Checkout session
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingUrl" } } }
        "200":
          description: Previously completed checkout replayed for the same idempotency key
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingUrl" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/change-plan:
    post:
      operationId: changeBillingPlan
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingPlanInput" } } }
      responses:
        "200":
          description: Immediate upgrade or scheduled downgrade
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingChangeResult" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/cancel:
    post:
      operationId: cancelBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingActionInput" } } }
      responses:
        "200":
          description: Cancellation scheduled at period end
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingCancellation" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/resume:
    post:
      operationId: resumeBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingActionInput" } } }
      responses:
        "200":
          description: Period-end cancellation removed
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingCancellation" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingActionInput" } } }
      responses:
        "200":
          description: Hosted Stripe customer portal
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingUrl" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/invoices:
    get:
      operationId: listBillingInvoices
      tags: [billing]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, pattern: "^in_[A-Za-z0-9]+$" } }
      responses:
        "200":
          description: Tenant customer invoices
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingInvoiceList" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409": { $ref: "#/components/responses/BillingConflict" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /billing/reconcile:
    post:
      operationId: reconcileBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BillingActionInput" } } }
      responses:
        "200":
          description: Reconciled billing status
          content: { application/json: { schema: { $ref: "#/components/schemas/BillingReconcileResult" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "422": { $ref: "#/components/responses/InvalidBillingRequest" }
        "502": { $ref: "#/components/responses/BillingProviderUnavailable" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/runtime-config:
    get:
      operationId: getRuntimeConfig
      tags: [health]
      responses:
        "200":
          description: Public runtime display configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      responses:
        "200":
          description: Current tenant workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401": { description: Authentication required }
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { description: Invalid workspace branding or profile update }
        "401": { description: Authentication required }
        "403": { description: Workspace permission or entitlement required }
  /custom-domain:
    get:
      operationId: getCustomDomain
      tags: [custom-domain]
      responses:
        "200":
          description: Current workspace custom-domain ownership verification status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomainStatus" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
    post:
      operationId: createCustomDomain
      tags: [custom-domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomDomainInput" }
      responses:
        "202":
          description: Domain ownership challenge created or replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomainStatus" }
        "400":
          description: Invalid or unsafe hostname
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409":
          description: Hostname is claimed by another workspace
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    delete:
      operationId: deleteCustomDomain
      tags: [custom-domain]
      responses:
        "204": { description: Local custom-domain ownership representation removed }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
  /custom-domain/verify:
    post:
      operationId: verifyCustomDomain
      tags: [custom-domain]
      responses:
        "202":
          description: Background DNS TXT ownership verification accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomainStatus" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "409":
          description: No retryable custom-domain verification is pending
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "429":
          description: Verification request rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Workspace dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 500
        - in: query
          name: status
          schema:
            type: string
            enum: [created, uploading, processing, ready, error]
        - in: query
          name: visibility
          schema:
            type: string
            enum: [private, unlisted, public]
        - in: query
          name: folderId
          schema:
            type: string
            description: A folder UUID, or root for videos with no folder.
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc, plays_desc]
            default: newest
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          description: Tenant video library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"
  /videos/bulk:
    patch:
      operationId: bulkUpdateVideos
      tags: [videos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkVideoUpdate"
      responses:
        "200":
          description: Ordered bulk video update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkVideoActionResult"
  /videos/bulk-delete:
    post:
      operationId: bulkDeleteVideos
      tags: [videos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkVideoDeleteInput"
      responses:
        "200":
          description: Ordered bulk video deletion result, including partial failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkVideoActionResult"
  /folders:
    get:
      operationId: listFolders
      tags: [folders]
      parameters:
        - in: query
          name: parentId
          required: true
          schema:
            type: string
            description: A folder UUID, or root for top-level folders.
      responses:
        "200":
          description: Direct child folders in the requested location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      operationId: createFolder
      tags: [folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
  /folders/{folderId}:
    get:
      operationId: getFolder
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Folder detail and ordered root-to-parent ancestors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
    patch:
      operationId: updateFolder
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderUpdate"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
    delete:
      operationId: deleteFolder
      tags: [folders]
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Empty folder deleted
  /videos/upload-init:
    post:
      operationId: initializeVideoUpload
      tags: [videos]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUploadInput"
      responses:
        "201":
          description: Direct-upload credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoUploadInitialization"
        "400":
          description: Invalid upload metadata or idempotency key
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Selected folder not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Workspace, provider, quota, or existing upload state conflicts with initialization
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "502":
          description: Video provider rejected asset creation
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Upload initialization is temporarily unavailable or requires reconciliation
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Video detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    patch:
      operationId: updateVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    delete:
      operationId: deleteVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: Video deleted
  /videos/{videoId}/playback:
    get:
      operationId: getAuthenticatedVideoPlayback
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Tenant-scoped provider-neutral playback metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedPlaybackVideo"
  /videos/{videoId}/master-status:
    get:
      operationId: getMasterStorageStatus
      tags: [videos]
      parameters: [ { $ref: "#/components/parameters/VideoId" } ]
      responses:
        "200":
          description: Tenant-scoped master archive status without provider or storage identity.
          content: { application/json: { schema: { $ref: "#/components/schemas/MasterStorageStatus" } } }
        "400":
          description: Invalid video identifier
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/master-archive:
    post:
      operationId: archiveVideoMaster
      tags: [videos]
      parameters: [ { $ref: "#/components/parameters/VideoId" } ]
      responses:
        "202":
          description: Durable archive operation accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/MasterStorageOperation" } } }
        "400":
          description: Invalid video identifier
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Video is not eligible for archive
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Master storage or provider-transfer adapter is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/master-restore:
    post:
      operationId: restoreVideoMaster
      tags: [videos]
      parameters: [ { $ref: "#/components/parameters/VideoId" } ]
      responses:
        "202":
          description: Durable restore operation accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/MasterStorageOperation" } } }
        "400":
          description: Invalid video identifier
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionRequired" }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Video has no archived master or is busy
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Master storage or provider-transfer adapter is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/thumbnail-upload-intent:
    post:
      operationId: createThumbnailUploadIntent
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailUploadIntentInput"
      responses:
        "201":
          description: Short-lived exact-object upload capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThumbnailUploadIntent"
        "400":
          description: Invalid video identifier or thumbnail metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Thumbnail upload intent conflicts with current video or thumbnail state
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Thumbnail storage is temporarily unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/thumbnail-finalize:
    post:
      operationId: finalizeThumbnail
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThumbnailFinalizeInput"
      responses:
        "200":
          description: Finalized thumbnail application route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thumbnail"
        "400":
          description: Invalid video identifier, intent, or finalized object metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Video or thumbnail object not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Thumbnail finalization conflicts with current intent state
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Thumbnail storage is temporarily unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/thumbnail:
    get:
      operationId: getVideoThumbnail
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - in: query
          name: v
          required: true
          description: Opaque current thumbnail version from thumbnailUrl.
          schema: { type: string, minLength: 1, maxLength: 128 }
      description: Requires the opaque current `v` query value returned in thumbnailUrl.
      responses:
        "200":
          description: Authenticated thumbnail bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          description: Video, current thumbnail version, or stored object not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Thumbnail storage is temporarily unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    delete:
      operationId: deleteVideoThumbnail
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: Thumbnail removed
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Thumbnail mutation is already in progress
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/playback/source:
    get:
      operationId: getAuthenticatedVideoPlaybackSource
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "307":
          description: Authenticated redirect to a short-lived signed playback manifest
          headers:
            Location:
              schema: { type: string }
  /videos/{videoId}/upload-complete:
    post:
      operationId: completeVideoUpload
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionReference"
      responses:
        "200":
          description: Upload acknowledged for provider processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid upload session reference
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Upload cannot be acknowledged in its current state
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /videos/{videoId}/upload-cancel:
    post:
      operationId: cancelVideoUpload
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionReference"
      responses:
        "200":
          description: Upload cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid upload session reference
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Video not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Upload cannot be cancelled safely in its current state
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Provider cancellation is temporarily unavailable or requires reconciliation
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent workspace activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: subjectType, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: actorKind, in: query, schema: { type: string, enum: [user, system, webhook, job] } }
        - { name: actorUserId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Stable, tenant-scoped audit event page
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventPage" } } }
  /audit-events/export:
    get:
      operationId: exportAuditEvents
      tags: [audit]
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: subjectType, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: actorKind, in: query, schema: { type: string, enum: [user, system, webhook, job] } }
        - { name: actorUserId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: UTF-8 CSV audit export, capped at 10,000 rows
          content: { text/csv: { schema: { type: string, format: binary } } }
  /permission-groups:
    get:
      operationId: listPermissionGroups
      tags: [members]
      responses:
        "200":
          description: Permission groups available in the current workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionGroup"
    post:
      operationId: createPermissionGroup
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGroupInput"
      responses:
        "201":
          description: Permission group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroup"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspace]
      responses:
        "200":
          description: Active workspaces available to the signed-in user
