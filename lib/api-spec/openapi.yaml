openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Multi-tenant video platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: videos
  - name: workspace
  - name: members
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/runtime-config:
    get:
      operationId: getRuntimeConfig
      tags: [health]
      responses:
        "200":
          description: Public runtime display configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      responses:
        "200":
          description: Current tenant workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Workspace dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Tenant video library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
  /videos/upload-init:
    post:
      operationId: initializeVideoUpload
      tags: [videos]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUploadInput"
      responses:
        "201":
          description: Direct-upload credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoUploadInitialization"
  /videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Video detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
    patch:
      operationId: updateVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
  /videos/{videoId}/playback:
    get:
      operationId: getAuthenticatedVideoPlayback
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Tenant-scoped provider-neutral playback metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedPlaybackVideo"
  /videos/{videoId}/playback/source:
    get:
      operationId: getAuthenticatedVideoPlaybackSource
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "307":
          description: Authenticated redirect to a short-lived signed playback manifest
          headers:
            Location:
              schema: { type: string }
  /videos/{videoId}/upload-complete:
    post:
      operationId: completeVideoUpload
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Upload acknowledged for provider processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
  /videos/{videoId}/upload-cancel:
    post:
      operationId: cancelVideoUpload
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Upload cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent workspace activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /permission-groups:
    get:
      operationId: listPermissionGroups
      tags: [members]
      responses:
        "200":
          description: Permission groups available in the current workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionGroup"
    post:
      operationId: createPermissionGroup
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGroupInput"
      responses:
        "201":
          description: Permission group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroup"
  /permission-groups/{groupId}:
    patch:
      operationId: updatePermissionGroup
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionGroupInput"
      responses:
        "200":
          description: Permission group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroup"
    delete:
      operationId: deletePermissionGroup
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Permission group deleted
  /permissions:
    get:
      operationId: listPermissions
      tags: [members]
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      responses:
        "200":
          description: Current workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /members/{membershipId}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /invitations:
    post:
      operationId: createInvitation
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /public/videos/{videoId}:
    get:
      operationId: getPublicVideo
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Provider-neutral public playback metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVideo"
  /public/videos/{videoId}/source:
    get:
      operationId: getPublicVideoSource
      tags: [videos]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "307":
          description: Redirect to a short-lived signed playback manifest
          headers:
            Location:
              schema: { type: string }
  /public/playback-events:
    post:
      operationId: createPlaybackEvents
      tags: [videos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackEventBatch"
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: number }
components:
  parameters:
    VideoId:
      in: path
      name: videoId
      required: true
      schema:
        type: string
    GroupId:
      in: path
      name: groupId
      required: true
      schema:
        type: string
    MembershipId:
      in: path
      name: membershipId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    RuntimeConfig:
      type: object
      required: [productName, appDomain]
      properties:
        productName: { type: string }
        appDomain: { type: string }
    Workspace:
      type: object
      required: [id, name, slug, plan, memberCount, storageUsedGb, storageLimitGb, entitlements, playerAccent, playerControlForeground, playerControlBackground, logoInitials, logoObjectKey, watermarkObjectKey, posterTreatment, customDomain, customDomainVerified]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan: { type: string }
        memberCount: { type: number }
        storageUsedGb: { type: number }
        storageLimitGb: { type: number }
        entitlements:
          type: object
          additionalProperties:
            oneOf:
              - { type: boolean }
              - { type: number }
              - { type: string }
        playerAccent: { type: string }
        playerControlForeground: { type: string }
        playerControlBackground: { type: string }
        logoInitials: { type: string }
        logoObjectKey: { type: ["string", "null"] }
        watermarkObjectKey: { type: ["string", "null"] }
        posterTreatment:
          type: string
          enum: [default, darken, gradient]
        customDomain: { type: ["string", "null"] }
        customDomainVerified: { type: boolean }
    WorkspaceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        playerAccent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        playerControlForeground: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        playerControlBackground: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        logoInitials: { type: string, minLength: 1, maxLength: 3 }
        logoObjectKey: { type: ["string", "null"], maxLength: 1024 }
        watermarkObjectKey: { type: ["string", "null"], maxLength: 1024 }
        posterTreatment:
          type: string
          enum: [default, darken, gradient]
        customDomain: { type: ["string", "null"], maxLength: 253 }
    Dashboard:
      type: object
      required: [totalVideos, totalPlays, watchTimeHours, completionRate, playsTrend, topVideos]
      properties:
        totalVideos: { type: number }
        totalPlays: { type: number }
        watchTimeHours: { type: number }
        completionRate: { type: number }
        playsTrend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        topVideos:
          type: array
          items:
            $ref: "#/components/schemas/TopVideo"
    TrendPoint:
      type: object
      required: [date, plays]
      properties:
        date: { type: string }
        plays: { type: number }
    TopVideo:
      type: object
      required: [id, title, plays, completionRate]
      properties:
        id: { type: string }
        title: { type: string }
        plays: { type: number }
        completionRate: { type: number }
    Video:
      type: object
      required: [id, title, description, status, visibility, durationSeconds, createdAt, thumbnailColor, plays, completionRate]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [created, uploading, processing, ready, error]
        visibility:
          type: string
          enum: [private, unlisted, public]
        durationSeconds: { type: number }
        createdAt: { type: string, format: date-time }
        thumbnailColor: { type: string }
        plays: { type: number }
        completionRate: { type: number }
        embedUrl: { type: string }
        embedPath: { type: string }
        embedCode: { type: string }
        videoObject:
          $ref: "#/components/schemas/VideoObject"
    VideoObject:
      type: object
      required: ["@context", "@type", name, description, embedUrl, duration]
      properties:
        "@context": { type: string, enum: ["https://schema.org"] }
        "@type": { type: string, enum: [VideoObject] }
        name: { type: string }
        description: { type: string }
        embedUrl: { type: string }
        duration: { type: string }
        thumbnailUrl: { type: string }
    VideoUploadInput:
      type: object
      required: [title, fileName, contentType, contentLength]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 127 }
        contentLength: { type: number, minimum: 1, maximum: 2147483647 }
    VideoUploadInitialization:
      type: object
      required: [videoId, upload]
      properties:
        videoId: { type: string }
        upload:
          oneOf:
            - $ref: "#/components/schemas/TusUploadCredentials"
            - $ref: "#/components/schemas/MultipartUploadCredentials"
    TusUploadCredentials:
      type: object
      required: [kind, endpoint, headers, expiresAt]
      properties:
        kind: { type: string, enum: [tus] }
        endpoint: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    MultipartUploadCredentials:
      type: object
      required: [kind, uploadId, partSizeBytes, parts, completeUrl, expiresAt]
      properties:
        kind: { type: string, enum: [multipart] }
        uploadId: { type: string }
        partSizeBytes: { type: number }
        parts:
          type: array
          items:
            type: object
            required: [number, url, headers]
            properties:
              number: { type: number }
              url: { type: string }
              headers: { type: object, additionalProperties: { type: string } }
        completeUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    VideoUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, unlisted, public]
    ActivityItem:
      type: object
      required: [id, action, subject, actor, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        subject: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    PermissionGroup:
      type: object
      required: [id, name, description, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    PermissionGroupInput:
      type: object
      required: [name, description, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 240 }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    Permission:
      type: object
      required: [key, description]
      properties:
        key: { type: string }
        description: { type: string }
    Member:
      type: object
      required: [id, name, email, groupId, role, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        groupId: { type: string }
        role: { type: string }
        status:
          type: string
          enum: [invited, active, suspended]
    MemberUpdate:
      type: object
      properties:
        groupId: { type: string }
        status:
          type: string
          enum: [active, suspended]
    InvitationInput:
      type: object
      required: [email, groupId]
      properties:
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        groupId: { type: string }
    Invitation:
      type: object
      required: [id, email, groupId, role, status, expiresAt]
      properties:
        id: { type: string }
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        groupId: { type: string }
        role: { type: string }
        status:
          type: string
          enum: [invited]
        expiresAt: { type: string, format: date-time }
    PublicVideo:
      type: object
      required: [id, title, description, status, visibility, durationSeconds, thumbnailColor, playerAccent, playerControlForeground, playerControlBackground, posterTreatment]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [created, uploading, processing, ready, error]
        visibility:
          type: string
          enum: [unlisted, public]
        durationSeconds: { type: number }
        thumbnailColor: { type: string }
        playerAccent: { type: string }
        playerControlForeground: { type: string }
        playerControlBackground: { type: string }
        posterTreatment: { type: string }
        sourceUrl: { type: string }
        sourceType:
          type: string
          enum: [hls, native]
        sourceExpiresAt: { type: string, format: date-time }
        posterUrl:
          type: ["string", "null"]
        logoUrl: { type: string }
        watermarkUrl: { type: string }
    AuthenticatedPlaybackVideo:
      type: object
      required: [id, title, description, status, visibility, durationSeconds, thumbnailColor, playerAccent, playerControlForeground, playerControlBackground, posterTreatment]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [created, uploading, processing, ready, error]
        visibility:
          type: string
          enum: [private, unlisted, public]
        durationSeconds: { type: number }
        thumbnailColor: { type: string }
        playerAccent: { type: string }
        playerControlForeground: { type: string }
        playerControlBackground: { type: string }
        posterTreatment: { type: string }
        sourceUrl: { type: string }
        sourceType:
          type: string
          enum: [hls, native]
        sourceExpiresAt: { type: string, format: date-time }
        posterUrl:
          type: ["string", "null"]
        logoUrl: { type: string }
        watermarkUrl: { type: string }
    PlaybackEventInput:
      type: object
      required: [videoId, sessionId, eventType, positionSeconds, occurredAt]
      properties:
        videoId: { type: string }
        sessionId: { type: string }
        eventType:
          type: string
          enum: [load, play, progress, pause, ended, error]
        positionSeconds: { type: number, minimum: 0 }
        occurredAt: { type: string, format: date-time }
    PlaybackEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlaybackEventInput"