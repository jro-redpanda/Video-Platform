kind = "web"
previewPath = "/"
title = "Video Platform"
description = "A multi-tenant video operations platform for managing customer workspaces, video libraries, uploads, embeds, permissions, customization, and first-party analytics while keeping video providers replaceable."
version = "1.0.0"
id = "artifacts/video-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18478

[services.development]
run = "pnpm --filter @workspace/video-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/video-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18478"
BASE_PATH = "/"
